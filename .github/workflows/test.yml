# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  pull_request:
    branches: [ "master", "feature/build-speedup" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    env:
      CUDA_VISIBLE_DEVICES: "-1"
      TORCHPOTENTIAL_DEVICE: "cpu"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      OMP_NUM_THREADS: "2"

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install general dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
    - name: Checkout torchpotential
      uses: actions/checkout@v4
      with:
        # configure these repository variables (Settings -> Variables) for the repository hosting TorchPotential
        repository: ${{ vars.TORCHPOTENTIAL_REPOSITORY }}
        ref: ${{ vars.TORCHPOTENTIAL_REF || 'main' }}
        path: torchpotential
    - name: Install torchpotential (CPU-only PyTorch)
      run: |
        python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
        python -m pip install ./torchpotential
    - name: Install python-ace
      run: |    
        python -m pip install .
    - name: Test python-ace with torchpotential
      run: |
        python -m pip check
        python -c 'import pyace, torchpotential, torch, numpy as np; print("Versions:", pyace.__version__, torchpotential.__version__, torch.__version__, np.__version__)'
        python -m pytest tests/ --runtorchpot
    - name: Integration test of CLI
      run: |
        cd tests/test-CLI/Cu-I && sh integration_test.sh
        cd ../Ethanol && sh integration_test.sh
